<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitQuest</title><style>:root{--bg:#0b1020;--card:#151c31;--muted:#9ca8c7;--a:#6ee7b7;--b:#60a5fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#10182b);color:#f5f7ff;font-family:system-ui}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px}.card,.day{background:var(--card);border:1px solid #263252;border-radius:20px;padding:16px;margin:12px 0}.hero{display:flex;gap:15px;align-items:center}.avatar{width:105px;height:105px;border-radius:25px;background:#202c49;display:grid;place-items:center;font-size:60px}.bar{height:9px;background:linear-gradient(90deg,var(--b),var(--a));border-radius:9px;width:64%}.track{height:9px;background:#26304b;border-radius:9px;margin:9px 0}.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#1d2741;padding:10px;border-radius:14px}.stat b{display:block;font-size:20px}.stat small,.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.day{margin:0;cursor:pointer}.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #27304a}.thumb{width:58px;height:58px;border-radius:14px;background:#263452;display:grid;place-items:center;font-size:27px}button,select{border:0;border-radius:14px;padding:12px;font-weight:800;background:var(--a);color:#07131a}button{width:100%;margin-top:10px}.secondary{background:#202b46;color:white;border:1px solid #334263}.back{background:none;color:var(--muted);width:auto;margin:0}.hidden{display:none}.tag{font-size:11px;background:#203d38;color:#a7f3d0;padding:5px 8px;border-radius:20px}</style></head><body><div class="app"><div class="top"><div class="logo">⚡ FitQuest</div><select id="lang" onchange="setLang(this.value)"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div><section id="home"><h1 id="hello">Olá 👋</h1><p class="sub" id="sub">Escolhe o teu treino de hoje.</p><div class="card hero"><div class="avatar" id="avatar">🧍‍♂️</div><div><span class="tag" id="status">Ativo</span><h2>Nível <span id="lvl">2</span></h2><div class="track"><div class="bar" id="xpbar"></div></div><small class="sub"><span id="xp">640</span> / 1000 XP</small></div></div><div class="stats"><div class="stat"><b id="done">7</b><small>treinos</small></div><div class="stat"><b id="skills">5</b><small>competências</small></div><div class="stat"><b id="streak">4</b><small>dias seguidos</small></div></div><div class="card"><h3>Escolher dia</h3><div class="grid"><div class="day" onclick="openDay('A')"><b>Dia A</b><br><small>Peito • Ombros</small></div><div class="day" onclick="openDay('B')"><b>Dia B</b><br><small>Costas • Braços</small></div><div class="day" onclick="openDay('C')"><b>Dia C</b><br><small>Pernas • Core</small></div><div class="day" onclick="openDay('D')"><b>Dia D</b><br><small>Cardio • Técnica</small></div></div></div></section><section id="workout" class="hidden"><button class="back" onclick="home()">← Voltar</button><h1 id="title"></h1><p class="sub">Segue os exercícios e marca cada um como concluído.</p><div class="card" id="list"></div><button onclick="finish()">✓ Terminar treino</button></section></div><script>const E={A:[['🏋️','Chest press','3 × 12'],['💪','Shoulder press','3 × 12'],['🪽','Cable fly','3 × 15'],['🔥','Lateral raise','3 × 12']],B:[['🏋️','Lat pulldown','3 × 12'],['🪢','Seated row','3 × 12'],['💪','Biceps curl','3 × 12'],['🔻','Triceps pushdown','3 × 12']],C:[['🦵','Leg press','3 × 12'],['🏃','Leg curl','3 × 12'],['🦶','Calf raise','3 × 15'],['🧘','Core','3 × 30s']],D:[['🚴','Bike','40 min'],['🎯','Technique drill','10 min'],['🚶','Cool down','10 min'],['🧘','Mobility','8 min']]};let s=JSON.parse(localStorage.fitquest||'{"xp":640,"lvl":2,"done":7,"skills":5,"streak":4}');function render(){xp.textContent=s.xp;lvl.textContent=s.lvl;done.textContent=s.done;skills.textContent=s.skills;streak.textContent=s.streak;xpbar.style.width=(s.xp/10)+'%';avatar.textContent=s.lvl>=5?'🦸':s.lvl>=4?'🏋️':s.lvl>=3?'💪':'🧍‍♂️'}function openDay(d){homeEl.classList.add('hidden');workout.classList.remove('hidden');title.textContent='Dia '+d;list.innerHTML=E[d].map(x=>`<div class="ex"><div class="thumb">${x[0]}</div><div style="flex:1"><b>${x[1]}</b><br><small class="sub">${x[2]}</small></div><button class="secondary" style="width:auto;margin:0" onclick="this.textContent='✓'">OK</button></div>`).join('')}function finish(){s.xp+=180;s.done++;s.skills++;s.streak++;if(s.xp>=1000){s.xp-=1000;s.lvl++}localStorage.fitquest=JSON.stringify(s);render();home()}function home(){workout.classList.add('hidden');homeEl.classList.remove('hidden')}function setLang(l){if(l==='en'){hello.textContent='Hello 👋';sub.textContent="Choose today's workout."}if(l==='es'){hello.textContent='Hola 👋';sub.textContent='Elige tu entrenamiento de hoy.'}if(l==='fr'){hello.textContent='Bonjour 👋';sub.textContent='Choisis ton entraînement du jour.'}if(l==='pt'){hello.textContent='Olá 👋';sub.textContent='Escolhe o teu treino de hoje.'}}const homeEl=document.getElementById('home');render();</script></div></body></html>
